<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Graphly.net</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
  <script>
    (function () {
      // 1. /pro (끝 슬래시 없음) 접속 시 상대경로 기준 통일을 위해 /pro/ 로 즉시 정규화
      var path = window.location.pathname || '';
      if (/\/pro$/i.test(path)) {
        window.location.replace(path + '/' + (window.location.search || '') + (window.location.hash || ''));
        return;
      }

      // 2. 상위 본서버 루트 절대 경로 산출 (https://graphly.net/ 또는 http://127.0.0.1:PORT/)
      var rootBaseUrl = new URL('../', window.location.href).href;

      // 2.5. <head> 최상단 선행 격리 스크립트: 본섭·테섭(1번 계정 공유)과 프로섭(2번 이메일 계정 전용)을 한 크롬 안에서 100% 물리 격리!
      var proPrebootIsolationSource = '(' + (function () {
        if (window.__GRAPHLY_PRO_STORAGE_ISOLATED__) return;
        window.__GRAPHLY_PRO_STORAGE_ISOLATED__ = true;

        var LS_PREFIX = 'pro_iso::';
        var PRO_FB_APP_NAME = 'PRO_STUDIO';

        // (A) localStorage 네임스페이스 칸막이 (본섭·테섭 키와 0% 간섭)
        try {
          var origGetItem = Storage.prototype.getItem;
          var origSetItem = Storage.prototype.setItem;
          var origRemoveItem = Storage.prototype.removeItem;
          var origClear = Storage.prototype.clear;

          function toProKey(k) {
            var s = String(k);
            if (s.indexOf(LS_PREFIX) === 0) return s;
            return LS_PREFIX + s;
          }

          Storage.prototype.getItem = function (k) {
            if (this === window.localStorage) {
              return origGetItem.call(this, toProKey(k));
            }
            return origGetItem.call(this, k);
          };

          Storage.prototype.setItem = function (k, v) {
            if (this === window.localStorage) {
              return origSetItem.call(this, toProKey(k), v);
            }
            return origSetItem.call(this, k, v);
          };

          Storage.prototype.removeItem = function (k) {
            if (this === window.localStorage) {
              return origRemoveItem.call(this, toProKey(k));
            }
            return origRemoveItem.call(this, k);
          };

          Storage.prototype.clear = function () {
            if (this === window.localStorage) {
              var toDel = [];
              for (var i = 0; i < this.length; i++) {
                var rawK = this.key(i);
                if (rawK && (rawK.indexOf(LS_PREFIX) === 0 || rawK.indexOf(':' + PRO_FB_APP_NAME) !== -1)) {
                  toDel.push(rawK);
                }
              }
              for (var j = 0; j < toDel.length; j++) {
                origRemoveItem.call(this, toDel[j]);
              }
              return;
            }
            return origClear.call(this);
          };

          // 프로섭 첫 진입 시 가이드 투어 모달 자동 생략
          if (!origGetItem.call(window.localStorage, LS_PREFIX + 'graphly_intro_seen_v1')) {
            origSetItem.call(window.localStorage, LS_PREFIX + 'graphly_intro_seen_v1', '1');
          }
        } catch (_) { }

        // (B) IndexedDB 물리 DB 분리 (Firebase 인증 토큰 금고 + 클라우드 보관함 캐시 + 최근 PDF 캐시 모두 별도 DB 사용)
        try {
          if (window.IDBFactory && IDBFactory.prototype && typeof IDBFactory.prototype.open === 'function') {
            var origIdbOpen = IDBFactory.prototype.open;
            IDBFactory.prototype.open = function (name, version) {
              var dbName = String(name || '');
              if (
                dbName === 'firebaseLocalStorageDb' ||
                dbName === 'graphly_pdf_cache_db' ||
                dbName === 'GraphlyCloudCacheDB'
              ) {
                dbName = dbName + '__pro_studio';
              } else if (dbName.indexOf('firestore/') === 0 && dbName.indexOf('__pro_studio') === -1) {
                dbName = dbName + '__pro_studio';
              }
              return version !== undefined
                ? origIdbOpen.call(this, dbName, version)
                : origIdbOpen.call(this, dbName);
            };
          }
        } catch (_) { }

        // (C) Firebase Auth / Firestore 인스턴스를 'PRO_STUDIO' 전용 앱으로 자동 라우팅
        var proApp = null;
        var origInit = null;

        function getOrCreateProApp(fb, cfg) {
          if (proApp) return proApp;
          if (fb && Array.isArray(fb.apps)) {
            for (var i = 0; i < fb.apps.length; i++) {
              if (fb.apps[i] && fb.apps[i].name === PRO_FB_APP_NAME) {
                proApp = fb.apps[i];
                return proApp;
              }
            }
          }
          if (cfg && origInit) {
            proApp = origInit(cfg, PRO_FB_APP_NAME);
          }
          return proApp;
        }

        function installFirebaseAppIsolation() {
          var fb = window.firebase;
          if (!fb || typeof fb.initializeApp !== 'function') return false;

          if (!fb.__proInitIsolated) {
            fb.__proInitIsolated = true;
            origInit = fb.initializeApp.bind(fb);
            fb.initializeApp = function (config, name) {
              if (!name || name === '[DEFAULT]') {
                return getOrCreateProApp(fb, config);
              }
              return origInit(config, name);
            };
            if (typeof fb.app === 'function') {
              var rawAppFn = fb.app;
              var origApp = rawAppFn.bind(fb);
              var wrappedApp = function (name) {
                if (!name || name === '[DEFAULT]') {
                  var target = proApp || getOrCreateProApp(fb, window.graphApp && window.graphApp._firebaseConfig);
                  return target || origApp(PRO_FB_APP_NAME);
                }
                return origApp(name);
              };
              Object.keys(rawAppFn).forEach(function (k) { wrappedApp[k] = rawAppFn[k]; });
              fb.app = wrappedApp;
            }
          }

          if (typeof fb.auth === 'function' && !fb.auth.__proWrapped) {
            var rawAuthFn = fb.auth;
            var origAuth = rawAuthFn.bind(fb);
            var wrappedAuth = function (appArg) {
              var target = appArg || proApp || getOrCreateProApp(fb, window.graphApp && window.graphApp._firebaseConfig);
              return target ? origAuth(target) : origAuth();
            };
            Object.keys(rawAuthFn).forEach(function (k) { wrappedAuth[k] = rawAuthFn[k]; });
            if (rawAuthFn.GoogleAuthProvider) wrappedAuth.GoogleAuthProvider = rawAuthFn.GoogleAuthProvider;
            if (rawAuthFn.EmailAuthProvider) wrappedAuth.EmailAuthProvider = rawAuthFn.EmailAuthProvider;
            if (rawAuthFn.Persistence) {
              wrappedAuth.Persistence = rawAuthFn.Persistence;
            } else if (rawAuthFn.Auth && rawAuthFn.Auth.Persistence) {
              wrappedAuth.Persistence = rawAuthFn.Auth.Persistence;
            }
            wrappedAuth.__proWrapped = true;
            fb.auth = wrappedAuth;
          }

          if (typeof fb.firestore === 'function' && !fb.firestore.__proWrapped) {
            var rawFsFn = fb.firestore;
            var origFs = rawFsFn.bind(fb);
            var wrappedFs = function (appArg) {
              var target = appArg || proApp || getOrCreateProApp(fb, window.graphApp && window.graphApp._firebaseConfig);
              return target ? origFs(target) : origFs();
            };
            Object.keys(rawFsFn).forEach(function (k) { wrappedFs[k] = rawFsFn[k]; });
            if (rawFsFn.FieldValue) wrappedFs.FieldValue = rawFsFn.FieldValue;
            if (rawFsFn.Timestamp) wrappedFs.Timestamp = rawFsFn.Timestamp;
            wrappedFs.__proWrapped = true;
            fb.firestore = wrappedFs;
          }

          var allReady = Boolean(
            fb.__proInitIsolated &&
            typeof fb.auth === 'function' && fb.auth.__proWrapped && fb.auth.GoogleAuthProvider &&
            typeof fb.firestore === 'function' && fb.firestore.__proWrapped
          );
          if (allReady) {
            fb.__proIsolated = true;
          }
          return allReady;
        }

        // defer 또는 동적 로드되는 Firebase SDK(app/auth/firestore) 각 단계 직후 즉시 장착
        document.addEventListener('DOMContentLoaded', installFirebaseAppIsolation, true);
        window.addEventListener('load', installFirebaseAppIsolation, true);
        var fbWatchCount = 0;
        var fbTimer = setInterval(function () {
          fbWatchCount++;
          if (installFirebaseAppIsolation() || fbWatchCount > 240) {
            clearInterval(fbTimer);
          }
        }, 50);
      }).toString() + ')();';

      // 3. Pro 전용 플러그인 스크립트 (본서버 코어 파일 수정 0바이트 상태에서 런타임 주입)
      var proPluginSource = '(' + (function (ROOT_BASE_URL) {
        window.__GRAPHLY_PRO_EDITION__ = true;

        // Pro 전용 커서 & 가상 펜촉 제어 스타일 주입 (style.css의 cursor: none !important 우회)
        function ensureProStylesAndOverlay() {
          if (!document.getElementById('proMathStampStyle') && document.head) {
            var stEl = document.createElement('style');
            stEl.id = 'proMathStampStyle';
            stEl.textContent = [
              'canvas.pro-hover-math-stamp { cursor: move !important; }',
              'canvas.pro-dragging-math-stamp { cursor: move !important; }',
              'body.pro-hide-virtual-stylus #virtualStylusPen { display: none !important; opacity: 0 !important; }',
              '#proMathStampOverlay {',
              '  position: fixed;',
              '  left: 0; top: 0;',
              '  pointer-events: none !important;',
              '  z-index: 45;',
              '  display: none;',
              '}'
            ].join('\n');
            document.head.appendChild(stEl);
          }

          var ov = document.getElementById('proMathStampOverlay');
          if (!ov && document.body) {
            ov = document.createElement('canvas');
            ov.id = 'proMathStampOverlay';
            ov.style.display = 'none';
            document.body.appendChild(ov);
          }
          return ov;
        }

        // 마우스 / 펜 커서의 최신 캔버스 좌표 추적 (F1 붙여넣기 왼쪽 위 모서리 기준점)
        var lastPointer = {
          hasValidCanvasPos: false,
          clientX: 0,
          clientY: 0
        };

        function recordPointerEvent(ev) {
          if (!ev) return;
          var cx = typeof ev.clientX === 'number' ? ev.clientX : null;
          var cy = typeof ev.clientY === 'number' ? ev.clientY : null;
          if (cx === null || cy === null || (!cx && !cy && ev.type === 'mousemove')) return;

          var app = window.graphApp;
          var canvas = (app && app.canvas) || document.getElementById('graphCanvas');
          if (canvas && typeof canvas.getBoundingClientRect === 'function') {
            var r = canvas.getBoundingClientRect();
            if (r.width > 10 && r.height > 10) {
              if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) {
                lastPointer.hasValidCanvasPos = true;
                lastPointer.clientX = cx;
                lastPointer.clientY = cy;
              }
              return;
            }
          }
          lastPointer.hasValidCanvasPos = true;
          lastPointer.clientX = cx;
          lastPointer.clientY = cy;
        }

        window.addEventListener('pointermove', recordPointerEvent, true);
        window.addEventListener('mousemove', recordPointerEvent, true);
        window.addEventListener('pointerdown', recordPointerEvent, true);

        function isCurrentSurfaceLight(app, isPdfBoard) {
          if (!app) return true;
          if (isPdfBoard || app.isMonochromeMode) return true;
          var themeKey = app.currentThemeKey || 'white_paper';
          var themeObj = (app.canvasThemes && app.canvasThemes[themeKey]) || { isLight: true };
          return Boolean(themeObj.isLight);
        }

        // 투명 배경 수식 디코딩 + 밝은/어두운 칠판용 글자색 쌍 + 타이트한 실제 글자 영역(tightBox) 산출
        function decodeAndPrepareMathImage(fileOrBlob) {
          return new Promise(function (resolve, reject) {
            var blobUrl = URL.createObjectURL(fileOrBlob);
            var img = new Image();
            img.onload = function () {
              try {
                var natW = Math.max(2, img.naturalWidth || img.width || 2);
                var natH = Math.max(2, img.naturalHeight || img.height || 2);

                var c = document.createElement('canvas');
                c.width = natW;
                c.height = natH;
                var ctx = c.getContext('2d', { willReadFrequently: true });
                ctx.clearRect(0, 0, natW, natH);
                ctx.drawImage(img, 0, 0, natW, natH);

                var rawUrl = c.toDataURL('image/png');
                var imgData = ctx.getImageData(0, 0, natW, natH);
                var data = imgData.data;
                var totalPx = natW * natH;
                var transparentPx = 0;
                var neutralOpaqueCount = 0;
                var neutralLumSum = 0;

                var inkMinX = natW, inkMinY = natH, inkMaxX = 0, inkMaxY = 0;
                var foundInk = false;

                for (var py = 0; py < natH; py++) {
                  for (var pxIdx = 0; pxIdx < natW; pxIdx++) {
                    var i = (py * natW + pxIdx) * 4;
                    var a = data[i + 3];
                    if (a < 32) transparentPx++;
                    if (a >= 32) {
                      foundInk = true;
                      if (pxIdx < inkMinX) inkMinX = pxIdx;
                      if (pxIdx > inkMaxX) inkMaxX = pxIdx;
                      if (py < inkMinY) inkMinY = py;
                      if (py > inkMaxY) inkMaxY = py;
                    }
                    if (a >= 40) {
                      var r = data[i], g = data[i + 1], b = data[i + 2];
                      var chroma = Math.max(r, g, b) - Math.min(r, g, b);
                      if (chroma < 55) {
                        neutralLumSum += (0.299 * r + 0.587 * g + 0.114 * b);
                        neutralOpaqueCount++;
                      }
                    }
                  }
                }

                var isTransparentMath = (totalPx > 0) && ((transparentPx / totalPx) >= 0.08);
                var tightBox = (isTransparentMath && foundInk && inkMaxX >= inkMinX && inkMaxY >= inkMinY)
                  ? {
                    u0: Math.max(0, (inkMinX - 3) / natW),
                    v0: Math.max(0, (inkMinY - 3) / natH),
                    u1: Math.min(1, (inkMaxX + 4) / natW),
                    v1: Math.min(1, (inkMaxY + 4) / natH)
                  }
                  : { u0: 0, v0: 0, u1: 1, v1: 1 };

                var lightSurfaceUrl = rawUrl;
                var darkSurfaceUrl = rawUrl;

                if (isTransparentMath && neutralOpaqueCount > 0) {
                  var avgLum = neutralLumSum / neutralOpaqueCount;
                  var invCanvas = document.createElement('canvas');
                  invCanvas.width = natW;
                  invCanvas.height = natH;
                  var invCtx = invCanvas.getContext('2d');
                  var invImgData = invCtx.createImageData(natW, natH);
                  var dst = invImgData.data;

                  for (var j = 0; j < data.length; j += 4) {
                    var rr = data[j], gg = data[j + 1], bb = data[j + 2], aa = data[j + 3];
                    var ch = Math.max(rr, gg, bb) - Math.min(rr, gg, bb);
                    if (aa > 0 && ch < 65) {
                      dst[j] = Math.max(15, Math.min(248, 255 - rr));
                      dst[j + 1] = Math.max(23, Math.min(250, 255 - gg));
                      dst[j + 2] = Math.max(42, Math.min(252, 255 - bb));
                      dst[j + 3] = aa;
                    } else {
                      dst[j] = rr;
                      dst[j + 1] = gg;
                      dst[j + 2] = bb;
                      dst[j + 3] = aa;
                    }
                  }
                  invCtx.putImageData(invImgData, 0, 0);
                  var invertedUrl = invCanvas.toDataURL('image/png');

                  if (avgLum < 128) {
                    lightSurfaceUrl = rawUrl;
                    darkSurfaceUrl = invertedUrl;
                  } else {
                    lightSurfaceUrl = invertedUrl;
                    darkSurfaceUrl = rawUrl;
                  }
                }

                URL.revokeObjectURL(blobUrl);
                resolve({
                  natW: natW,
                  natH: natH,
                  isTransparentMath: isTransparentMath,
                  tightBox: tightBox,
                  lightSurfaceUrl: lightSurfaceUrl,
                  darkSurfaceUrl: darkSurfaceUrl
                });
              } catch (err) {
                URL.revokeObjectURL(blobUrl);
                reject(err);
              }
            };
            img.onerror = function (err) {
              URL.revokeObjectURL(blobUrl);
              reject(err);
            };
            img.src = blobUrl;
          });
        }

        // 미세 선택 & 드래그 상태 전역 관리
        var proSelectedStamp = null;   // '톡' 눌러 선택된 수식 (방향키 이동 가능 + 은은한 미세 테두리 표시)
        var proHoveredStamp = null;    // 포인터가 글자 영역 위에 올라간 수식
        var activeStampDrag = null;    // 현재 잡고 끌고 있는 수식 상태
        var arrowNudgeSession = null;  // 연속 방향키 이동 시 단일 Undo 묶음

        function getStampScreenBounds(appInst, st) {
          if (!appInst || !st || !Array.isArray(st.points) || st.points.length < 2) return null;
          var isBoard = (st.target || 'board') === 'board';
          if (appInst.isGraphCovered && !appInst.pdfPageBoardData && !isBoard) return null;
          if (!appInst.isGraphCovered && isBoard) return null;
          if (!isBoard && Boolean(st.onPdfBoard) !== Boolean(appInst.pdfPageBoardData)) return null;

          var s0 = isBoard ? appInst.boardToScreen(st.points[0].x, st.points[0].y) : appInst.mathToScreen(st.points[0].x, st.points[0].y);
          var s1 = isBoard ? appInst.boardToScreen(st.points[1].x, st.points[1].y) : appInst.mathToScreen(st.points[1].x, st.points[1].y);
          var minX = Math.min(s0.x, s1.x), maxX = Math.max(s0.x, s1.x);
          var minY = Math.min(s0.y, s1.y), maxY = Math.max(s0.y, s1.y);
          var w = maxX - minX, h = maxY - minY;
          if (!(w >= 2 && h >= 2)) return null;

          var tb = (st.graphStamp && st.graphStamp._proTightBox) || { u0: 0, v0: 0, u1: 1, v1: 1 };
          return {
            isBoard: isBoard,
            x: minX,
            y: minY,
            w: w,
            h: h,
            gx0: minX + w * tb.u0,
            gy0: minY + h * tb.v0,
            gx1: minX + w * tb.u1,
            gy1: minY + h * tb.v1
          };
        }

        // 오버레이 캔버스 렌더링: 드래그 중에는 [수식 실시간 미리보기 + 미세 테두리], 톡 선택 시에는 [은은한 미세 테두리] 표시!
        function renderProStampOverlay() {
          var appInst = window.graphApp;
          var ov = ensureProStylesAndOverlay();
          if (!ov || !appInst || !appInst.canvas) return;

          var draggingStroke = activeStampDrag && activeStampDrag.stroke;
          var targetStroke = draggingStroke || proSelectedStamp;

          // 선택된 스탬프가 삭제되었거나 다른 슬라이드로 넘어갔으면 자동 해제
          if (targetStroke && (!Array.isArray(appInst.inkStrokes) || appInst.inkStrokes.indexOf(targetStroke) === -1)) {
            if (proSelectedStamp === targetStroke) proSelectedStamp = null;
            targetStroke = draggingStroke || null;
          }

          var bounds = targetStroke ? getStampScreenBounds(appInst, targetStroke) : null;
          if (!targetStroke || !bounds) {
            if (ov.style.display !== 'none') ov.style.display = 'none';
            return;
          }

          var cRect = appInst.canvas.getBoundingClientRect();
          if (!(cRect.width > 10 && cRect.height > 10)) {
            ov.style.display = 'none';
            return;
          }

          var dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
          var cssW = Math.round(cRect.width);
          var cssH = Math.round(cRect.height);
          var physW = Math.round(cssW * dpr);
          var physH = Math.round(cssH * dpr);

          if (ov.style.display !== 'block') ov.style.display = 'block';
          ov.style.left = cRect.left + 'px';
          ov.style.top = cRect.top + 'px';
          ov.style.width = cssW + 'px';
          ov.style.height = cssH + 'px';
          if (ov.width !== physW) ov.width = physW;
          if (ov.height !== physH) ov.height = physH;

          var scaleX = appInst.screenWidth ? (cssW / appInst.screenWidth) : 1;
          var scaleY = appInst.screenHeight ? (cssH / appInst.screenHeight) : 1;

          var ctx = ov.getContext('2d');
          ctx.setTransform(dpr * scaleX, 0, 0, dpr * scaleY, 0, 0);
          ctx.clearRect(0, 0, appInst.screenWidth || cssW, appInst.screenHeight || cssH);

          // 1) 드래그 이동 중일 때는 원래 베이크에서 잠시 빠져 있으므로 오버레이에서 수식 이미지를 실시간 좌표에 직접 그림!
          if (draggingStroke) {
            var cache = draggingStroke._stampCache;
            var drawImg = (cache && cache.img && cache.img.complete && cache.img.naturalWidth > 0)
              ? cache.img
              : (cache && cache.liveDrawable);
            if (drawImg) {
              ctx.save();
              ctx.imageSmoothingEnabled = true;
              try { ctx.imageSmoothingQuality = 'high'; } catch (_) { }
              ctx.drawImage(drawImg, bounds.x, bounds.y, bounds.w, bounds.h);
              ctx.restore();
            }
          }

          // 2) 눈 아프지 않고 위치·줄맞춤 가늠이 정확히 되는 미세 점선 테두리 표시
          var isLight = isCurrentSurfaceLight(appInst, Boolean(targetStroke.onPdfBoard));
          var strokeCol = isLight
            ? (draggingStroke ? 'rgba(37, 99, 235, 0.52)' : 'rgba(37, 99, 235, 0.38)')
            : (draggingStroke ? 'rgba(56, 189, 248, 0.62)' : 'rgba(56, 189, 248, 0.45)');

          ctx.save();
          ctx.strokeStyle = strokeCol;
          ctx.lineWidth = 1.1;
          ctx.setLineDash([4, 3]);
          ctx.strokeRect(
            Math.round(bounds.x) - 1.5,
            Math.round(bounds.y) - 1.5,
            Math.round(bounds.w) + 3,
            Math.round(bounds.h) + 3
          );
          ctx.restore();
        }

        function clearProSelectedStamp() {
          arrowNudgeSession = null;
          if (proSelectedStamp) {
            proSelectedStamp = null;
            renderProStampOverlay();
          }
        }

        function syncAllProMathStampsToCurrentTheme(app) {
          if (!app || !Array.isArray(app.inkStrokes)) return;
          var changed = false;
          for (var i = 0; i < app.inkStrokes.length; i++) {
            var st = app.inkStrokes[i];

            // 4) '톡' 눌러 선택된 상태에서 키보드 화살표(↑↓←→)로 1px 단위(Shift는 8px) 정밀 이동 + Delete 삭제 + Esc 해제!
            window.addEventListener('keydown', function (ev) {
              var curApp = window.graphApp;
              if (!curApp || !proSelectedStamp) return;
              if (typeof curApp._isViewerOrReplayBlockingEdit === 'function' && curApp._isViewerOrReplayBlockingEdit()) return;

              var activeEl = document.activeElement;
              var isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable);
              if (isInput) return;

              if (!Array.isArray(curApp.inkStrokes) || curApp.inkStrokes.indexOf(proSelectedStamp) === -1) {
                clearProSelectedStamp();
                return;
              }

              var rawK = ev.key || '';
              var codeK = ev.code || '';
              var key = (rawK === 'ArrowLeft' || rawK === 'ArrowRight' || rawK === 'ArrowUp' || rawK === 'ArrowDown' || rawK === 'Escape' || rawK === 'Delete' || rawK === 'Backspace')
                ? rawK
                : ((codeK === 'ArrowLeft' || codeK === 'ArrowRight' || codeK === 'ArrowUp' || codeK === 'ArrowDown' || codeK === 'Escape' || codeK === 'Delete' || codeK === 'Backspace')
                  ? codeK
                  : (ev.keyCode === 37 ? 'ArrowLeft' : ev.keyCode === 39 ? 'ArrowRight' : ev.keyCode === 38 ? 'ArrowUp' : ev.keyCode === 40 ? 'ArrowDown' : ev.keyCode === 27 ? 'Escape' : ev.keyCode === 46 ? 'Delete' : ev.keyCode === 8 ? 'Backspace' : rawK));
              if (key === 'Escape') {
                ev.preventDefault();
                ev.stopPropagation();
                if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
                clearProSelectedStamp();
                return;
              }

              if ((key === 'Delete' || key === 'Backspace') && !ev.ctrlKey && !ev.metaKey) {
                ev.preventDefault();
                ev.stopPropagation();
                if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
                var delTarget = proSelectedStamp;
                var delIdx = curApp.inkStrokes.indexOf(delTarget);
                if (delIdx !== -1) {
                  curApp.inkStrokes.splice(delIdx, 1);
                  if (!Array.isArray(curApp.undoStack)) curApp.undoStack = [];
                  curApp.undoStack.push({ type: 'pro_stamp_delete', stroke: delTarget, index: delIdx });
                  curApp.redoStack = [];
                  clearProSelectedStamp();
                  curApp._inkBakeDirty = true;
                  if (typeof curApp.updateUndoRedoUI === 'function') curApp.updateUndoRedoUI();
                  if (curApp.isAudioRecording && typeof curApp._archiveStrokeRemovedDuringRecording === 'function') {
                    curApp._archiveStrokeRemovedDuringRecording(delTarget);
                  }
                  if (curApp.isAudioRecording && typeof curApp._recordAudioWorkspaceStateIfNeeded === 'function') {
                    curApp._recordAudioWorkspaceStateIfNeeded(true);
                  }
                  curApp.render();
                }
                return;
              }

              if (key !== 'ArrowLeft' && key !== 'ArrowRight' && key !== 'ArrowUp' && key !== 'ArrowDown') return;
              if (ev.ctrlKey || ev.altKey || ev.metaKey) return;

              // 본서버의 슬라이드 넘김(좌/우 화살표) 등을 차단하고 선택된 수식만 정밀 이동!
              ev.preventDefault();
              ev.stopPropagation();
              if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();

              var stepPx = ev.shiftKey ? 8 : 2;
              var dx = (key === 'ArrowLeft') ? -stepPx : (key === 'ArrowRight' ? stepPx : 0);
              var dy = (key === 'ArrowUp') ? -stepPx : (key === 'ArrowDown' ? stepPx : 0);

              var st = proSelectedStamp;
              if (!arrowNudgeSession || arrowNudgeSession.stroke !== st) {
                arrowNudgeSession = {
                  stroke: st,
                  undoEntry: {
                    type: 'pro_stamp_move',
                    stroke: st,
                    strokeId: st.id,
                    fromPts: [{ ...st.points[0] }, { ...st.points[1] }],
                    toPts: null
                  }
                };
                if (!Array.isArray(curApp.undoStack)) curApp.undoStack = [];
                curApp.undoStack.push(arrowNudgeSession.undoEntry);
                curApp.redoStack = [];
                if (typeof curApp.updateUndoRedoUI === 'function') curApp.updateUndoRedoUI();
              }

              var isBoard = (st.target || 'board') === 'board';
              var s0 = isBoard ? curApp.boardToScreen(st.points[0].x, st.points[0].y) : curApp.mathToScreen(st.points[0].x, st.points[0].y);
              var s1 = isBoard ? curApp.boardToScreen(st.points[1].x, st.points[1].y) : curApp.mathToScreen(st.points[1].x, st.points[1].y);

              var np0 = isBoard ? curApp.screenToBoard(s0.x + dx, s0.y + dy) : curApp.screenToMath(s0.x + dx, s0.y + dy);
              var np1 = isBoard ? curApp.screenToBoard(s1.x + dx, s1.y + dy) : curApp.screenToMath(s1.x + dx, s1.y + dy);

              st.points[0].x = np0.x;
              st.points[0].y = np0.y;
              st.points[1].x = np1.x;
              st.points[1].y = np1.y;

              arrowNudgeSession.undoEntry.toPts = [{ ...st.points[0] }, { ...st.points[1] }];

              curApp._inkBakeDirty = true;
              if (curApp.isAudioRecording && typeof curApp._recordAudioWorkspaceStateIfNeeded === 'function') {
                curApp._recordAudioWorkspaceStateIfNeeded(true);
              }
              curApp.render();
              renderProStampOverlay();
            }, true);
          }

          // 수식 위치 이동 및 삭제에 대한 0ms 경량 Undo / Redo 연동
          if (typeof proto.undo === 'function') {
            var origUndo = proto.undo;
            proto.undo = function () {
              arrowNudgeSession = null;
              var top = Array.isArray(this.undoStack) && this.undoStack.length > 0 ? this.undoStack[this.undoStack.length - 1] : null;
              if (top && top.type === 'pro_stamp_move') {
                this.undoStack.pop();
                var target = (this.inkStrokes || []).find(function (s) { return s === top.stroke || (s && top.strokeId && s.id === top.strokeId); });
                if (target && Array.isArray(target.points) && target.points.length >= 2) {
                  target.points[0].x = top.fromPts[0].x; target.points[0].y = top.fromPts[0].y;
                  target.points[1].x = top.fromPts[1].x; target.points[1].y = top.fromPts[1].y;
                }
                if (!Array.isArray(this.redoStack)) this.redoStack = [];
                this.redoStack.push(top);
                this._inkBakeDirty = true;
                if (typeof this.updateUndoRedoUI === 'function') this.updateUndoRedoUI();
                if (this.isAudioRecording && typeof this._recordAudioWorkspaceStateIfNeeded === 'function') {
                  this._recordAudioWorkspaceStateIfNeeded(true);
                }
                this.render();
                renderProStampOverlay();
                return;
              }
              if (top && top.type === 'pro_stamp_delete') {
                this.undoStack.pop();
                if (!Array.isArray(this.inkStrokes)) this.inkStrokes = [];
                var insIdx = Math.min(this.inkStrokes.length, Math.max(0, top.index || 0));
                this.inkStrokes.splice(insIdx, 0, top.stroke);
                if (!Array.isArray(this.redoStack)) this.redoStack = [];
                this.redoStack.push(top);
                proSelectedStamp = top.stroke;
                this._inkBakeDirty = true;
                if (typeof this.updateUndoRedoUI === 'function') this.updateUndoRedoUI();
                if (this.isAudioRecording && typeof this._recordAudioWorkspaceStateIfNeeded === 'function') {
                  this._recordAudioWorkspaceStateIfNeeded(true);
                }
                this.render();
                renderProStampOverlay();
                return;
              }
              var res = origUndo.apply(this, arguments);
              renderProStampOverlay();
              return res;
            };
          }

          if (typeof proto.redo === 'function') {
            var origRedo = proto.redo;
            proto.redo = function () {
              arrowNudgeSession = null;
              var top = Array.isArray(this.redoStack) && this.redoStack.length > 0 ? this.redoStack[this.redoStack.length - 1] : null;
              if (top && top.type === 'pro_stamp_move') {
                this.redoStack.pop();
                var target = (this.inkStrokes || []).find(function (s) { return s === top.stroke || (s && top.strokeId && s.id === top.strokeId); });
                if (target && Array.isArray(target.points) && target.points.length >= 2 && top.toPts) {
                  target.points[0].x = top.toPts[0].x; target.points[0].y = top.toPts[0].y;
                  target.points[1].x = top.toPts[1].x; target.points[1].y = top.toPts[1].y;
                }
                if (!Array.isArray(this.undoStack)) this.undoStack = [];
                this.undoStack.push(top);
                this._inkBakeDirty = true;
                if (typeof this.updateUndoRedoUI === 'function') this.updateUndoRedoUI();
                if (this.isAudioRecording && typeof this._recordAudioWorkspaceStateIfNeeded === 'function') {
                  this._recordAudioWorkspaceStateIfNeeded(true);
                }
                this.render();
                renderProStampOverlay();
                return;
              }
              if (top && top.type === 'pro_stamp_delete') {
                this.redoStack.pop();
                if (Array.isArray(this.inkStrokes)) {
                  var idx = this.inkStrokes.indexOf(top.stroke);
                  if (idx !== -1) this.inkStrokes.splice(idx, 1);
                }
                if (proSelectedStamp === top.stroke) proSelectedStamp = null;
                if (!Array.isArray(this.undoStack)) this.undoStack = [];
                this.undoStack.push(top);
                this._inkBakeDirty = true;
                if (typeof this.updateUndoRedoUI === 'function') this.updateUndoRedoUI();
                if (this.isAudioRecording && typeof this._recordAudioWorkspaceStateIfNeeded === 'function') {
                  this._recordAudioWorkspaceStateIfNeeded(true);
                }
                this.render();
                renderProStampOverlay();
                return;
              }
              var res = origRedo.apply(this, arguments);
              renderProStampOverlay();
              return res;
            };
          }

          // 5) 학생용 공유 링크 복사 및 QR 생성 시 /pro 경로가 노출되지 않도록 정식 본서버 주소(https://graphly.net/#...)로 자동 정화
          function sanitizeProUrlInText(text) {
            if (typeof text !== 'string') return text;
            return text.replace(/(\/pro\/?)(?=(?:\?[^#\s]*)?#(cloud|share|student)=)/gi, '/');
          }

          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            var origWriteText = navigator.clipboard.writeText.bind(navigator.clipboard);
            navigator.clipboard.writeText = function (txt) {
              return origWriteText(sanitizeProUrlInText(txt));
            };
          }

          if (typeof proto._downloadQrCodePngForUrl === 'function') {
            var origQr = proto._downloadQrCodePngForUrl;
            proto._downloadQrCodePngForUrl = function (shareUrl, title, effFilter) {
              return origQr.call(this, sanitizeProUrlInText(shareUrl), title, effFilter);
            };
          }

          if (window.MiniQRCode && typeof window.MiniQRCode.drawToCanvas === 'function' && !window.MiniQRCode.__proQrSanitized) {
            var origProDrawQr = window.MiniQRCode.drawToCanvas.bind(window.MiniQRCode);
            window.MiniQRCode.drawToCanvas = function (urlStr, canvasEl, opts) {
              return origProDrawQr(sanitizeProUrlInText(urlStr), canvasEl, opts);
            };
            window.MiniQRCode.__proQrSanitized = true;
          }

          return true;
        }

        if (!installGraphAppProHooks()) {
          window.addEventListener('DOMContentLoaded', function () {
            setTimeout(installGraphAppProHooks, 0);
          });
          var retryCount = 0;
          var timer = setInterval(function () {
            retryCount++;
            if (installGraphAppProHooks() || retryCount > 60) {
              clearInterval(timer);
            }
          }, 100);
        }
      }).toString() + ')(' + JSON.stringify(rootBaseUrl) + ');';

      // 4. 본서버 루트 index.html을 실시간 로드하여 <base>와 Pro 플러그인만 꽂아 부팅 (본서버 업데이트 100% 자동 반영!)
      fetch(rootBaseUrl + 'index.html?_proboot=' + Date.now(), { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function (rawHtml) {
          var headInject = '<base href="' + rootBaseUrl + '">\n  <meta name="robots" content="noindex, nofollow">\n  <script>' + proPrebootIsolationSource + '<\/script>';
          var patched = rawHtml.replace(/<head([^>]*)>/i, '<head$1>\n  ' + headInject);
          var scriptTag = '\n  <script>' + proPluginSource + '<\/script>\n</body>';
          if (/<\/body>/i.test(patched)) {
            patched = patched.replace(/<\/body>/i, scriptTag);
          } else {
            patched += scriptTag;
          }
          document.open();
          document.write(patched);
          document.close();
        })
        .catch(function (err) {
          document.body.innerHTML =
            '<div style="font-family:sans-serif;padding:40px;color:#1e293b;line-height:1.6;">' +
            '<h3>Graphly Pro 로더 안내</h3>' +
            '<p>로컬 파일(file://) 직접 열기 대신 웹 서버(<code>https://graphly.net/pro</code> 또는 <code>Run_Server.bat</code>)를 통해 접속해 주세요.</p>' +
            '<pre style="color:#64748b;font-size:12px;">' + String(err) + '</pre>' +
            '</div>';
        });
    })();
  </script>
</head>
