<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Graphly iPad 짭플펜슬 필기 씹힘 진단기 (ink-diag)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    #topBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      overflow-x: auto;
    }
    .bar-btn {
      height: 40px;
      padding: 0 13px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    .bar-btn:active {
      transform: scale(0.97);
    }
    #btnCaptureDrop {
      background: #dc2626;
      border-color: #f87171;
      color: #ffffff;
      font-size: 15px;
      padding: 0 18px;
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.35);
    }
    #btnTogglePreventDefault.on {
      background: #0369a1;
      border-color: #38bdf8;
    }
    #btnTogglePreventDefault.off {
      background: #7c2d12;
      border-color: #fb923c;
    }
    #liveCounters {
      margin-left: auto;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      white-space: nowrap;
      padding: 6px 10px;
      background: #1e293b;
      border-radius: 6px;
      border: 1px solid #334155;
      flex-shrink: 0;
    }
    #drawCanvas {
      position: fixed;
      top: 56px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 56px);
      background: #ffffff;
      touch-action: none;
      display: block;
    }
    #modalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.78);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      touch-action: auto;
    }
    #modalOverlay.show {
      display: flex;
    }
    .modal-card {
      width: min(1120px, 96vw);
      height: min(840px, 92vh);
      background: #ffffff;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }
    .modal-header {
      padding: 12px 16px;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .modal-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 16px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .snap-tab {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .snap-tab.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #1d4ed8;
    }
    .modal-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
      min-height: 0;
    }
    @media (max-width: 820px) {
      .modal-body {
        grid-template-columns: 1fr;
        grid-template-rows: 1.1fr 1fr;
      }
    }
    .traj-box {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .traj-legend {
      padding: 8px 12px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-weight: 600;
      color: #334155;
    }
    .legend-dot {
      display: inline-block;
      width: 18px;
      height: 4px;
      vertical-align: middle;
      margin-right: 4px;
      border-radius: 2px;
    }
    #snapCanvasWrap {
      flex: 1;
      position: relative;
      min-height: 0;
      background: #ffffff;
    }
    #snapCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .info-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      padding-right: 4px;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    .verdict-card {
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
    }
    .verdict-card.verdict-A {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1e3a8a;
    }
    .verdict-card.verdict-B {
      border-color: #ea580c;
      background: #fff7ed;
      color: #7c2d12;
    }
    .verdict-card.verdict-C {
      border-color: #64748b;
      background: #f1f5f9;
      color: #1e293b;
    }
    .verdict-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .verdict-desc {
      font-size: 13px;
      line-height: 1.45;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .summary-cell {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }
    .summary-cell .num {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
    }
    .summary-cell .lbl {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }
    .track-list {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      font-size: 12px;
    }
    .track-list table {
      width: 100%;
      border-collapse: collapse;
    }
    .track-list th, .track-list td {
      padding: 6px 8px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }
    .track-list th {
      background: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }
    #jsonFallbackBox {
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    #jsonFallbackBox.show {
      display: flex;
    }
    #jsonTextarea {
      width: 100%;
      height: 120px;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      user-select: text;
      -webkit-user-select: text;
    }
    #toastMsg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      z-index: 300;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="topBar">
    <button type="button" id="btnCaptureDrop" class="bar-btn">🚨 씹힘!</button>
    <button type="button" id="btnOpenSnapshots" class="bar-btn">📋 스냅샷 목록 (0)</button>
    <button type="button" id="btnCopyJson" class="bar-btn">📤 기록 복사</button>
    <button type="button" id="btnClearCanvas" class="bar-btn">🧹 지우기</button>
    <button type="button" id="btnTogglePreventDefault" class="bar-btn on">touch preventDefault: ON</button>
    <div id="liveCounters">펜 획 0 · 터치 접촉 0 · cancel 0</div>
  </div>

  <canvas id="drawCanvas"></canvas>

  <div id="modalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <div style="font-size: 15px; font-weight: 800;">🔍 직전 3초 스냅샷 정밀 분석</div>
        <div style="display: flex; gap: 8px;">
          <button type="button" id="btnModalCopyJson" class="bar-btn" style="height: 34px; background: #2563eb; border-color: #60a5fa;">📤 전체 JSON 복사</button>
          <button type="button" id="btnCloseModal" class="bar-btn" style="height: 34px;">✕ 닫기 (계속 필기)</button>
        </div>
      </div>
      <div class="modal-tabs" id="snapTabs"></div>
      <div class="modal-body">
        <div class="traj-box">
          <div class="traj-legend">
            <span><i class="legend-dot" style="background:#111827;"></i>Pointer: pen (검정 실선)</span>
            <span><i class="legend-dot" style="background:#ef4444;"></i>Pointer: touch (빨강 실선)</span>
            <span><i class="legend-dot" style="background:#2563eb; border-bottom: 2px dashed #2563eb; height:0;"></i>Touch: stylus (파랑 점선)</span>
            <span><i class="legend-dot" style="background:#f97316; border-bottom: 2px dashed #f97316; height:0;"></i>Touch: direct (주황 점선)</span>
          </div>
          <div id="snapCanvasWrap">
            <canvas id="snapCanvas"></canvas>
          </div>
        </div>
        <div class="info-box">
          <div id="verdictBox" class="verdict-card verdict-C">
            <div class="verdict-title" id="verdictTitle">판정 대기 중</div>
            <div class="verdict-desc" id="verdictDesc">스냅샷을 선택하세요.</div>
          </div>
          <div class="summary-grid" id="summaryGrid"></div>
          <div id="jsonFallbackBox">
            <div style="font-size: 12px; font-weight: 700; color: #dc2626;">클립보드 권한 제한 또는 수동 복사용 JSON (전체 선택됨):</div>
            <textarea id="jsonTextarea" readonly></textarea>
          </div>
          <div style="font-size: 12px; font-weight: 700; color: #334155;">3초 내 개별 접촉 궤적 목록 (시작점 라벨과 대조):</div>
          <div class="track-list">
            <table>
              <thead>
                <tr>
                  <th>구분 / ID</th>
                  <th>타입</th>
                  <th>크기 (w / rx)</th>
                  <th>이동거리</th>
                  <th>짝짓기 / 상태</th>
                </tr>
              </thead>
              <tbody id="trackTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toastMsg"></div>

  <script>
    (function () {
      'use strict';

      // 기본 제스처/메뉴 차단 (setPointerCapture 절대 사용 금지)
      window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });
      window.addEventListener('selectstart', function (e) {
        if (e.target && e.target.id === 'jsonTextarea') return;
        e.preventDefault();
      }, { passive: false });
      window.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });

      var drawCanvas = document.getElementById('drawCanvas');
      var ctx = drawCanvas.getContext('2d');
      var topBar = document.getElementById('topBar');
      var modalOverlay = document.getElementById('modalOverlay');
      var btnCaptureDrop = document.getElementById('btnCaptureDrop');
      var btnOpenSnapshots = document.getElementById('btnOpenSnapshots');
      var btnCopyJson = document.getElementById('btnCopyJson');
      var btnModalCopyJson = document.getElementById('btnModalCopyJson');
      var btnClearCanvas = document.getElementById('btnClearCanvas');
      var btnTogglePreventDefault = document.getElementById('btnTogglePreventDefault');
      var btnCloseModal = document.getElementById('btnCloseModal');
      var liveCounters = document.getElementById('liveCounters');
      var snapTabs = document.getElementById('snapTabs');
      var snapCanvas = document.getElementById('snapCanvas');
      var snapCanvasWrap = document.getElementById('snapCanvasWrap');
      var verdictBox = document.getElementById('verdictBox');
      var verdictTitle = document.getElementById('verdictTitle');
      var verdictDesc = document.getElementById('verdictDesc');
      var summaryGrid = document.getElementById('summaryGrid');
      var trackTableBody = document.getElementById('trackTableBody');
      var jsonFallbackBox = document.getElementById('jsonFallbackBox');
      var jsonTextarea = document.getElementById('jsonTextarea');
      var toastMsg = document.getElementById('toastMsg');

      var touchPreventDefaultOn = true;
      var dpr = Math.max(1, window.devicePixelRatio || 1);
      var canvasTopOffset = 56;

      // 링버퍼 (최근 6초, 최대 8000건)
      var MAX_BUFFER_LEN = 8000;
      var BUFFER_WINDOW_MS = 6000;
      var SNAPSHOT_WINDOW_MS = 3000;
      var MAX_SNAPSHOTS = 10;

      var eventBuffer = [];
      var snapshots = [];
      var activeSnapshotIdx = -1;

      // 실시간 누적 카운터 (1초 주기로만 DOM 반영)
      var totalPenStrokes = 0;
      var totalTouchContacts = 0;
      var totalCancels = 0;

      // 펜 전용 실시간 드로잉 상태 (오직 pointerType === 'pen' 만 그림)
      var activePenPointerId = null;
      var lastPenX = 0;
      var lastPenY = 0;

      function resizeDrawCanvas() {
        dpr = Math.max(1, window.devicePixelRatio || 1);
        var w = window.innerWidth;
        var h = Math.max(100, window.innerHeight - canvasTopOffset);
        drawCanvas.style.width = w + 'px';
        drawCanvas.style.height = h + 'px';
        drawCanvas.width = Math.round(w * dpr);
        drawCanvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 2.4;
      }

      resizeDrawCanvas();
      window.addEventListener('resize', resizeDrawCanvas);

      function round2(v) {
        return typeof v === 'number' && !isNaN(v) ? Math.round(v * 100) / 100 : null;
      }
      function round3(v) {
        return typeof v === 'number' && !isNaN(v) ? Math.round(v * 1000) / 1000 : null;
      }

      // 상단 바 또는 모달 위에서 발생한 UI 조작 이벤트인지 판별 (분석에서 제외)
      function isUiElement(el) {
        var cur = el;
        while (cur && cur !== document.body && cur !== document.documentElement) {
          if (cur === topBar || cur === modalOverlay) return true;
          cur = cur.parentNode;
        }
        return false;
      }

      function getTargetLabel(el) {
        if (!el) return 'null';
        if (el.id) return '#' + el.id;
        return el.tagName ? String(el.tagName).toLowerCase() : 'unknown';
      }

      function pushRingBuffer(entry) {
        eventBuffer.push(entry);
        if (eventBuffer.length > MAX_BUFFER_LEN) {
          eventBuffer.splice(0, eventBuffer.length - MAX_BUFFER_LEN);
        }
      }

      // 2-3. 원본 이벤트 기록 (window capture 단계, DOM 갱신/console.log 절대 없음)
      function recordPointerEvent(e) {
        if (modalOverlay.classList.contains('show')) return;
        if (isUiElement(e.target)) return;

        var nowPerf = performance.now();
        var coalCount = null;
        if (typeof e.getCoalescedEvents === 'function') {
          try {
            var cList = e.getCoalescedEvents();
            coalCount = cList ? cList.length : 0;
          } catch (err) {
            coalCount = -1;
          }
        }

        if (e.type === 'pointerdown') {
          if (e.pointerType === 'pen') totalPenStrokes++;
          else if (e.pointerType === 'touch') totalTouchContacts++;
        } else if (e.type === 'pointercancel' || e.type === 'lostpointercapture') {
          totalCancels++;
        }

        pushRingBuffer({
          kind: 'P',
          type: e.type,
          t: round2(e.timeStamp),
          perfT: round2(nowPerf),
          pointerId: e.pointerId,
          pointerType: e.pointerType || 'unknown',
          isPrimary: Boolean(e.isPrimary),
          clientX: round2(e.clientX),
          clientY: round2(e.clientY),
          width: round2(e.width),
          height: round2(e.height),
          pressure: round3(e.pressure),
          buttons: e.buttons,
          button: e.button,
          tiltX: e.tiltX || 0,
          tiltY: e.tiltY || 0,
          altitudeAngle: typeof e.altitudeAngle === 'number' ? round3(e.altitudeAngle) : null,
          azimuthAngle: typeof e.azimuthAngle === 'number' ? round3(e.azimuthAngle) : null,
          coalescedCount: coalCount,
          target: getTargetLabel(e.target)
        });
      }

      function recordTouchEvent(e) {
        if (modalOverlay.classList.contains('show')) return;
        if (isUiElement(e.target)) return;

        var nowPerf = performance.now();
        if (e.type === 'touchcancel') {
          totalCancels++;
        }

        var changed = [];
        if (e.changedTouches) {
          for (var i = 0; i < e.changedTouches.length; i++) {
            var ct = e.changedTouches[i];
            changed.push({
              identifier: ct.identifier,
              touchType: ct.touchType || 'unknown',
              radiusX: typeof ct.radiusX === 'number' ? round2(ct.radiusX) : null,
              radiusY: typeof ct.radiusY === 'number' ? round2(ct.radiusY) : null,
              force: typeof ct.force === 'number' ? round3(ct.force) : null,
              altitudeAngle: typeof ct.altitudeAngle === 'number' ? round3(ct.altitudeAngle) : null,
              azimuthAngle: typeof ct.azimuthAngle === 'number' ? round3(ct.azimuthAngle) : null,
              clientX: round2(ct.clientX),
              clientY: round2(ct.clientY)
            });
          }
        }

        pushRingBuffer({
          kind: 'T',
          type: e.type,
          t: round2(e.timeStamp),
          perfT: round2(nowPerf),
          touchesLen: e.touches ? e.touches.length : 0,
          cancelable: Boolean(e.cancelable),
          target: getTargetLabel(e.target),
          changedTouches: changed
        });
      }

      var pEventNames = ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'lostpointercapture'];
      for (var i = 0; i < pEventNames.length; i++) {
        window.addEventListener(pEventNames[i], recordPointerEvent, { capture: true, passive: true });
      }

      var tEventNames = ['touchstart', 'touchmove', 'touchend', 'touchcancel'];
      for (var j = 0; j < tEventNames.length; j++) {
        window.addEventListener(tEventNames[j], recordTouchEvent, { capture: true, passive: true });
      }

      // 2-2. 필기 동작: pointerType === 'pen' 이벤트만 검은 선으로 즉시 직선 연결
      drawCanvas.addEventListener('pointerdown', function (e) {
        if (e.cancelable !== false) e.preventDefault();
        if (e.pointerType !== 'pen') return;
        activePenPointerId = e.pointerId;
        var x = e.clientX;
        var y = e.clientY - canvasTopOffset;
        lastPenX = x;
        lastPenY = y;
        ctx.fillStyle = '#111827';
        ctx.beginPath();
        ctx.arc(x, y, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }, { passive: false });

      drawCanvas.addEventListener('pointermove', function (e) {
        if (e.cancelable !== false) e.preventDefault();
        if (e.pointerType !== 'pen' || e.pointerId !== activePenPointerId) return;
        var x = e.clientX;
        var y = e.clientY - canvasTopOffset;
        ctx.beginPath();
        ctx.moveTo(lastPenX, lastPenY);
        ctx.lineTo(x, y);
        ctx.stroke();
        lastPenX = x;
        lastPenY = y;
      }, { passive: false });

      function endPenStroke(e) {
        if (e.pointerType !== 'pen' || e.pointerId !== activePenPointerId) return;
        if (e.type === 'pointerup') {
          var x = e.clientX;
          var y = e.clientY - canvasTopOffset;
          ctx.beginPath();
          ctx.moveTo(lastPenX, lastPenY);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
        activePenPointerId = null;
      }

      window.addEventListener('pointerup', endPenStroke, { passive: true });
      window.addEventListener('pointercancel', endPenStroke, { passive: true });

      // 캔버스 touchstart / touchmove / touchend (Graphly 조건 재현 + 토글 가능)
      function onCanvasTouch(e) {
        if (touchPreventDefaultOn && e.cancelable !== false) {
          e.preventDefault();
        }
      }
      drawCanvas.addEventListener('touchstart', onCanvasTouch, { passive: false });
      drawCanvas.addEventListener('touchmove', onCanvasTouch, { passive: false });
      drawCanvas.addEventListener('touchend', onCanvasTouch, { passive: false });

      // 1초에 한 번만 상단 카운터 갱신 및 6초 초과 버퍼 정리
      setInterval(function () {
        var nowPerf = performance.now();
        var cutoff = nowPerf - BUFFER_WINDOW_MS;
        while (eventBuffer.length > 0 && eventBuffer[0].perfT < cutoff) {
          eventBuffer.shift();
        }
        liveCounters.textContent = '펜 획 ' + totalPenStrokes + ' · 터치 접촉 ' + totalTouchContacts + ' · cancel ' + totalCancels;
      }, 1000);

      function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.style.display = 'block';
        if (showToast._timer) clearTimeout(showToast._timer);
        showToast._timer = setTimeout(function () {
          toastMsg.style.display = 'none';
        }, 2200);
      }

      // 2-5. 스냅샷 분석 및 A/B/C 자동 판정
      function analyzeEventsWindow(events) {
        var pTracks = [];
        var activeP = {};
        var tTracks = [];
        var activeT = {};

        var counts = {
          penStrokes: 0,
          touchPointers: 0,
          pointerCancel: 0,
          touchCancel: 0,
          lostCapture: 0
        };

        for (var i = 0; i < events.length; i++) {
          var ev = events[i];
          if (ev.kind === 'P') {
            if (ev.type === 'lostpointercapture') {
              counts.lostCapture++;
              var lpTrack = activeP[ev.pointerId];
              if (lpTrack) lpTrack.lostCapture = true;
              continue;
            }
            var pid = ev.pointerId;
            var tr = activeP[pid];
            if (ev.type === 'pointerdown' || !tr) {
              tr = {
                seq: pTracks.length + 1,
                kind: 'P',
                id: pid,
                pointerType: ev.pointerType,
                startT: ev.t,
                endT: ev.t,
                startPerfT: ev.perfT,
                endPerfT: ev.perfT,
                points: [],
                pathLen: 0,
                maxWidth: ev.width || 0,
                minWidth: ev.width || 0,
                canceled: false,
                lostCapture: false,
                pairedTouchTrack: null
              };
              activeP[pid] = tr;
              pTracks.push(tr);
              if (ev.pointerType === 'pen') counts.penStrokes++;
              else if (ev.pointerType === 'touch') counts.touchPointers++;
            }
            tr.endT = ev.t;
            tr.endPerfT = ev.perfT;
            if (typeof ev.width === 'number') {
              if (ev.width > tr.maxWidth) tr.maxWidth = ev.width;
              if (tr.minWidth === 0 || ev.width < tr.minWidth) tr.minWidth = ev.width;
            }
            if (tr.points.length > 0) {
              var prevP = tr.points[tr.points.length - 1];
              tr.pathLen += Math.hypot(ev.clientX - prevP.x, ev.clientY - prevP.y);
            }
            tr.points.push({
              type: ev.type,
              t: ev.t,
              perfT: ev.perfT,
              x: ev.clientX,
              y: ev.clientY,
              w: ev.width,
              h: ev.height,
              p: ev.pressure,
              coalesced: ev.coalescedCount
            });
            if (ev.type === 'pointercancel') {
              tr.canceled = true;
              counts.pointerCancel++;
              delete activeP[pid];
            } else if (ev.type === 'pointerup') {
              delete activeP[pid];
            }
          } else if (ev.kind === 'T') {
            if (ev.type === 'touchcancel') {
              counts.touchCancel++;
            }
            var cts = ev.changedTouches || [];
            for (var c = 0; c < cts.length; c++) {
              var ct = cts[c];
              var tid = ct.identifier;
              var tTr = activeT[tid];
              if (ev.type === 'touchstart' || !tTr) {
                tTr = {
                  seq: tTracks.length + 1,
                  kind: 'T',
                  id: tid,
                  touchType: ct.touchType || 'unknown',
                  startT: ev.t,
                  endT: ev.t,
                  startPerfT: ev.perfT,
                  endPerfT: ev.perfT,
                  points: [],
                  pathLen: 0,
                  maxRadiusX: ct.radiusX || 0,
                  minRadiusX: ct.radiusX || 0,
                  canceled: false,
                  pairedPointerTrack: null
                };
                activeT[tid] = tTr;
                tTracks.push(tTr);
              }
              if (ct.touchType === 'stylus') {
                tTr.touchType = 'stylus';
              }
              tTr.endT = ev.t;
              tTr.endPerfT = ev.perfT;
              if (typeof ct.radiusX === 'number') {
                if (ct.radiusX > tTr.maxRadiusX) tTr.maxRadiusX = ct.radiusX;
                if (tTr.minRadiusX === 0 || ct.radiusX < tTr.minRadiusX) tTr.minRadiusX = ct.radiusX;
              }
              if (tTr.points.length > 0) {
                var prevT = tTr.points[tTr.points.length - 1];
                tTr.pathLen += Math.hypot(ct.clientX - prevT.x, ct.clientY - prevT.y);
              }
              tTr.points.push({
                type: ev.type,
                t: ev.t,
                perfT: ev.perfT,
                x: ct.clientX,
                y: ct.clientY,
                rx: ct.radiusX,
                ry: ct.radiusY,
                force: ct.force,
                touchType: ct.touchType
              });
              if (ev.type === 'touchcancel') {
                tTr.canceled = true;
                delete activeT[tid];
              } else if (ev.type === 'touchend') {
                delete activeT[tid];
              }
            }
          }
        }

        // PointerEvent 와 TouchEvent 짝짓기: 시간(±20ms)과 좌표(±3px) 기준
        for (var ti = 0; ti < tTracks.length; ti++) {
          var tt = tTracks[ti];
          if (tt.points.length === 0) continue;
          var bestP = null;
          var bestDist = 999;
          for (var pi = 0; pi < pTracks.length; pi++) {
            var pt = pTracks[pi];
            if (pt.points.length === 0) continue;
            // 시작점 또는 샘플 간 매칭 검사
            for (var a = 0; a < Math.min(tt.points.length, 8); a++) {
              var tp = tt.points[a];
              for (var b = 0; b < Math.min(pt.points.length, 8); b++) {
                var pp = pt.points[b];
                var dt = Math.abs((tp.perfT || tp.t) - (pp.perfT || pp.t));
                var dxy = Math.hypot(tp.x - pp.x, tp.y - pp.y);
                if (dt <= 20 && dxy <= 3.0 && dxy < bestDist) {
                  bestDist = dxy;
                  bestP = pt;
                }
              }
            }
          }
          if (bestP) {
            tt.pairedPointerTrack = bestP;
            bestP.pairedTouchTrack = tt;
          }
        }

        // 판정 규칙 (A / B / C)
        // 글씨 후보: 이동 거리 >= 15px
        var candidateStylusWithoutPen = [];
        var candidateSmallDirectMove = [];
        var candidateAnyNonPenMove = [];

        for (var k = 0; k < tTracks.length; k++) {
          var trk = tTracks[k];
          var hasPairedPen = Boolean(trk.pairedPointerTrack && trk.pairedPointerTrack.pointerType === 'pen');
          if (trk.pathLen >= 15 && !hasPairedPen) {
            candidateAnyNonPenMove.push(trk);
            if (trk.touchType === 'stylus') {
              candidateStylusWithoutPen.push(trk);
            } else if (trk.touchType === 'direct' && (trk.minRadiusX <= 24 || trk.maxRadiusX <= 28)) {
              candidateSmallDirectMove.push(trk);
            }
          }
        }

        // TouchEvent 없이 PointerEvent(touch)만 온 경우도 후보 점검
        for (var m = 0; m < pTracks.length; m++) {
          var pTrk = pTracks[m];
          if (pTrk.pointerType !== 'pen' && pTrk.pathLen >= 15 && !pTrk.pairedTouchTrack) {
            candidateAnyNonPenMove.push(pTrk);
            if (pTrk.minWidth <= 48) {
              candidateSmallDirectMove.push(pTrk);
            }
          }
        }

        var verdict = 'C';
        var reason = '';

        if (candidateStylusWithoutPen.length > 0) {
          var s0 = candidateStylusWithoutPen[0];
          var pairedType = s0.pairedPointerTrack ? s0.pairedPointerTrack.pointerType : '없음';
          verdict = 'A';
          reason = '판정 A 확정: 펜슬 표시(touchType === "stylus")가 붙은 TouchEvent 글씨 궤적(T#' + s0.seq +
            ', 이동 ' + Math.round(s0.pathLen) + 'px, radiusX ' + s0.minRadiusX + '~' + s0.maxRadiusX +
            'px)이 존재하지만, 짝지어진 PointerEvent는 pointerType: "' + pairedType + '" 입니다. (정공법 구출 100% 가능!)';
        } else if (candidateSmallDirectMove.length > 0) {
          var d0 = candidateSmallDirectMove[0];
          var sizeStr = d0.kind === 'T'
            ? ('radiusX ' + d0.minRadiusX + '~' + d0.maxRadiusX + 'px')
            : ('width ' + d0.minWidth + '~' + d0.maxWidth + 'px');
          verdict = 'B';
          reason = '판정 B 유력: touchType === "direct"(일반 터치)로 분류되었으나 글씨처럼 움직인 소형 궤적(' +
            d0.kind + '#' + d0.seq + ', 이동 ' + Math.round(d0.pathLen) + 'px, ' + sizeStr + ')이 발견되었습니다.';
        } else if (candidateAnyNonPenMove.length > 0) {
          var m0 = candidateAnyNonPenMove[0];
          verdict = 'B';
          reason = '판정 B (비-펜 이동 궤적 발견): 펜(pen)이 아닌 이동 궤적(' + m0.kind + '#' + m0.seq +
            ', touchType: ' + (m0.touchType || m0.pointerType) + ', 이동 ' + Math.round(m0.pathLen) +
            'px, 크기 ' + (m0.maxRadiusX || m0.maxWidth) + 'px)이 기록되었습니다. 우측 표와 좌측 빨강/주황 궤적을 확인하세요.';
        } else {
          verdict = 'C';
          reason = '판정 C: 직전 3초 동안 15px 이상 움직인 비-펜(터치) 글씨 후보가 없습니다. (정지한 손날 접촉만 있거나, 씹힌 획의 이벤트가 Safari에서 아예 전달되지 않았습니다.)';
        }

        return {
          verdict: verdict,
          reason: reason,
          counts: counts,
          pTracks: pTracks,
          tTracks: tTracks
        };
      }

      // JSON 용량 최적화: 접촉당 move 이벤트가 60개를 넘으면 시작·끝·최대크기 지점을 보존하며 최대 60개로 간추림
      function downsampleTrackPoints(pts, maxCount) {
        if (!pts || pts.length <= maxCount) return pts;
        var maxIdx = 0;
        var maxVal = -1;
        for (var i = 0; i < pts.length; i++) {
          var sz = (pts[i].w !== undefined && pts[i].w !== null) ? pts[i].w : (pts[i].rx || 0);
          if (sz > maxVal) {
            maxVal = sz;
            maxIdx = i;
          }
        }
        var result = [];
        var step = (pts.length - 1) / (maxCount - 1);
        var includedMax = false;
        for (var k = 0; k < maxCount; k++) {
          var idx = Math.min(pts.length - 1, Math.round(k * step));
          if (idx === maxIdx) includedMax = true;
          result.push(pts[idx]);
        }
        if (!includedMax && maxIdx > 0 && maxIdx < pts.length - 1) {
          result[Math.floor(maxCount / 2)] = pts[maxIdx];
        }
        return result;
      }

      // 2-4. [🚨 씹힘!] 버튼 동작: 직전 3초 스냅샷 생성 및 오버레이 표시
      function captureSnapshotNow() {
        var nowPerf = performance.now();
        var cutoff = nowPerf - SNAPSHOT_WINDOW_MS;
        var recentEvents = [];
        for (var i = 0; i < eventBuffer.length; i++) {
          if (eventBuffer[i].perfT >= cutoff) {
            recentEvents.push(eventBuffer[i]);
          }
        }

        var analysis = analyzeEventsWindow(recentEvents);
        var snap = {
          index: snapshots.length + 1,
          capturedAt: new Date().toISOString(),
          touchPreventDefault: touchPreventDefaultOn,
          verdict: analysis.verdict,
          reason: analysis.reason,
          counts: analysis.counts,
          pTracks: analysis.pTracks,
          tTracks: analysis.tTracks,
          rawEventCount: recentEvents.length
        };

        snapshots.push(snap);
        if (snapshots.length > MAX_SNAPSHOTS) {
          snapshots.shift();
        }
        btnOpenSnapshots.textContent = '📋 스냅샷 목록 (' + snapshots.length + ')';
        activeSnapshotIdx = snapshots.length - 1;
        openSnapshotModal(activeSnapshotIdx);
      }

      function renderSnapshotTrajectory(snap) {
        var rect = snapCanvasWrap.getBoundingClientRect();
        var w = Math.max(200, rect.width || 480);
        var h = Math.max(180, rect.height || 360);
        snapCanvas.width = Math.round(w * dpr);
        snapCanvas.height = Math.round(h * dpr);
        var sCtx = snapCanvas.getContext('2d');
        sCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        sCtx.clearRect(0, 0, w, h);

        var srcW = Math.max(1, window.innerWidth);
        var srcH = Math.max(1, window.innerHeight - canvasTopOffset);
        var scale = Math.min((w - 24) / srcW, (h - 24) / srcH);
        var offX = (w - srcW * scale) * 0.5;
        var offY = (h - srcH * scale) * 0.5;

        function mapX(cx) { return offX + cx * scale; }
        function mapY(cy) { return offY + (cy - canvasTopOffset) * scale; }

        // 캔버스 경계 테두리
        sCtx.strokeStyle = '#cbd5e1';
        sCtx.lineWidth = 1;
        sCtx.strokeRect(offX, offY, srcW * scale, srcH * scale);

        // 1. Pointer: pen (검정 실선)
        for (var i = 0; i < snap.pTracks.length; i++) {
          var pt = snap.pTracks[i];
          if (pt.pointerType !== 'pen' || pt.points.length === 0) continue;
          sCtx.save();
          sCtx.strokeStyle = '#111827';
          sCtx.lineWidth = 2.2;
          sCtx.setLineDash([]);
          sCtx.beginPath();
          sCtx.moveTo(mapX(pt.points[0].x), mapY(pt.points[0].y));
          for (var j = 1; j < pt.points.length; j++) {
            sCtx.lineTo(mapX(pt.points[j].x), mapY(pt.points[j].y));
          }
          sCtx.stroke();
          sCtx.restore();
        }

        // 2. Pointer: touch (빨강 실선)
        for (var i2 = 0; i2 < snap.pTracks.length; i2++) {
          var pt2 = snap.pTracks[i2];
          if (pt2.pointerType === 'pen' || pt2.points.length === 0) continue;
          sCtx.save();
          sCtx.strokeStyle = '#ef4444';
          sCtx.lineWidth = 3.0;
          sCtx.setLineDash([]);
          var sx0 = mapX(pt2.points[0].x);
          var sy0 = mapY(pt2.points[0].y);
          sCtx.beginPath();
          sCtx.moveTo(sx0, sy0);
          for (var j2 = 1; j2 < pt2.points.length; j2++) {
            sCtx.lineTo(mapX(pt2.points[j2].x), mapY(pt2.points[j2].y));
          }
          sCtx.stroke();
          sCtx.fillStyle = 'rgba(239, 68, 68, 0.22)';
          sCtx.beginPath();
          sCtx.arc(sx0, sy0, Math.max(5, (pt2.maxWidth || 10) * 0.5 * scale), 0, Math.PI * 2);
          sCtx.fill();
          sCtx.fillStyle = '#b91c1c';
          sCtx.font = 'bold 11px sans-serif';
          sCtx.fillText('P#' + pt2.seq + '(w:' + pt2.maxWidth + ', L:' + Math.round(pt2.pathLen) + ')', sx0 + 6, sy0 - 6);
          sCtx.restore();
        }

        // 3 & 4. TouchEvent: stylus (파랑 점선) / direct (주황 점선)
        for (var k = 0; k < snap.tTracks.length; k++) {
          var tt = snap.tTracks[k];
          if (tt.points.length === 0) continue;
          var isStylus = (tt.touchType === 'stylus');
          sCtx.save();
          sCtx.strokeStyle = isStylus ? '#2563eb' : '#f97316';
          sCtx.lineWidth = isStylus ? 2.6 : 2.2;
          sCtx.setLineDash(isStylus ? [6, 4] : [4, 4]);
          var tx0 = mapX(tt.points[0].x);
          var ty0 = mapY(tt.points[0].y);
          sCtx.beginPath();
          sCtx.moveTo(tx0, ty0);
          for (var m = 1; m < tt.points.length; m++) {
            sCtx.lineTo(mapX(tt.points[m].x), mapY(tt.points[m].y));
          }
          sCtx.stroke();
          sCtx.setLineDash([]);
          sCtx.fillStyle = isStylus ? '#1d4ed8' : '#c2410c';
          sCtx.font = 'bold 11px sans-serif';
          sCtx.fillText(
            'T#' + tt.seq + '(' + tt.touchType + ', rx:' + tt.maxRadiusX + ', L:' + Math.round(tt.pathLen) + ')',
            tx0 + 6,
            ty0 + 13
          );
          sCtx.restore();
        }
      }

      function openSnapshotModal(idx) {
        if (snapshots.length === 0) {
          showToast('아직 저장된 스냅샷이 없습니다. [🚨 씹힘!]을 눌러주세요.');
          return;
        }
        activeSnapshotIdx = Math.max(0, Math.min(snapshots.length - 1, idx));
        modalOverlay.classList.add('show');
        jsonFallbackBox.classList.remove('show');

        // 탭 렌더링
        snapTabs.innerHTML = '';
        for (var i = 0; i < snapshots.length; i++) {
          (function (sIdx) {
            var s = snapshots[sIdx];
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'snap-tab' + (sIdx === activeSnapshotIdx ? ' active' : '');
            btn.textContent = '#' + s.index + ' [판정 ' + s.verdict + '] (' + s.capturedAt.slice(11, 19) + ')';
            btn.addEventListener('click', function () {
              openSnapshotModal(sIdx);
            });
            snapTabs.appendChild(btn);
          })(i);
        }

        var cur = snapshots[activeSnapshotIdx];
        verdictBox.className = 'verdict-card verdict-' + cur.verdict;
        verdictTitle.textContent = '자동 판정 결과: [' + cur.verdict + ']';
        verdictDesc.textContent = cur.reason;

        summaryGrid.innerHTML =
          '<div class="summary-cell"><div class="num">' + cur.counts.penStrokes + '</div><div class="lbl">펜 획 수 (pen)</div></div>' +
          '<div class="summary-cell"><div class="num">' + cur.counts.touchPointers + ' / ' + cur.tTracks.length + '</div><div class="lbl">터치 (Pointer / Touch)</div></div>' +
          '<div class="summary-cell"><div class="num">' + (cur.counts.pointerCancel + cur.counts.touchCancel + cur.counts.lostCapture) + '</div><div class="lbl">cancel / lostCapture</div></div>';

        var rowsHtml = '';
        for (var p = 0; p < cur.pTracks.length; p++) {
          var pt = cur.pTracks[p];
          var pairStrP = pt.pairedTouchTrack ? ('T#' + pt.pairedTouchTrack.seq + '(' + pt.pairedTouchTrack.touchType + ')') : '짝 없음';
          if (pt.canceled) pairStrP += ' [CANCEL]';
          rowsHtml += '<tr style="color:' + (pt.pointerType === 'pen' ? '#0f172a' : '#dc2626;font-weight:700;') + '">' +
            '<td>P#' + pt.seq + ' (id:' + pt.id + ')</td>' +
            '<td>pointer: ' + pt.pointerType + '</td>' +
            '<td>w: ' + pt.minWidth + '~' + pt.maxWidth + 'px</td>' +
            '<td>' + Math.round(pt.pathLen) + ' px (' + pt.points.length + '점)</td>' +
            '<td>' + pairStrP + '</td>' +
            '</tr>';
        }
        for (var t = 0; t < cur.tTracks.length; t++) {
          var tt = cur.tTracks[t];
          var pairStrT = tt.pairedPointerTrack ? ('P#' + tt.pairedPointerTrack.seq + '(' + tt.pairedPointerTrack.pointerType + ')') : '짝 없음';
          if (tt.canceled) pairStrT += ' [CANCEL]';
          var rowCol = tt.touchType === 'stylus' ? '#1d4ed8' : '#c2410c';
          rowsHtml += '<tr style="color:' + rowCol + ';font-weight:' + (tt.pathLen >= 15 ? '700' : '400') + ';">' +
            '<td>T#' + tt.seq + ' (id:' + tt.id + ')</td>' +
            '<td>touch: ' + tt.touchType + '</td>' +
            '<td>rx: ' + tt.minRadiusX + '~' + tt.maxRadiusX + 'px</td>' +
            '<td>' + Math.round(tt.pathLen) + ' px (' + tt.points.length + '점)</td>' +
            '<td>' + pairStrT + '</td>' +
            '</tr>';
        }
        if (!rowsHtml) {
          rowsHtml = '<tr><td colspan="5" style="text-align:center;color:#64748b;">직전 3초 동안 기록된 접촉이 없습니다.</td></tr>';
        }
        trackTableBody.innerHTML = rowsHtml;

        requestAnimationFrame(function () {
          renderSnapshotTrajectory(cur);
        });
      }

      // 2-6. [📤 기록 복사]: 환경 정보 + 스냅샷(간추린 궤적 포함) JSON 생성 및 클립보드/textarea 복사
      function buildExportJsonString() {
        if (snapshots.length === 0) {
          captureSnapshotNow();
        }
        var isStandalone = false;
        try {
          isStandalone = Boolean(
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            navigator.standalone
          );
        } catch (err) {}

        var payload = {
          env: {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            maxTouchPoints: navigator.maxTouchPoints,
            devicePixelRatio: window.devicePixelRatio,
            screenWidth: window.screen ? window.screen.width : null,
            screenHeight: window.screen ? window.screen.height : null,
            innerWidth: window.innerWidth,
            innerHeight: window.innerHeight,
            standalone: isStandalone,
            touchPreventDefault: touchPreventDefaultOn,
            exportedAt: new Date().toISOString()
          },
          snapshots: snapshots.map(function (s) {
            return {
              index: s.index,
              capturedAt: s.capturedAt,
              touchPreventDefault: s.touchPreventDefault,
              verdict: s.verdict,
              reason: s.reason,
              counts: s.counts,
              rawEventCount: s.rawEventCount,
              pointerTracks: s.pTracks.map(function (pt) {
                return {
                  seq: pt.seq,
                  id: pt.id,
                  pointerType: pt.pointerType,
                  startT: pt.startT,
                  endT: pt.endT,
                  pathLen: round2(pt.pathLen),
                  minWidth: pt.minWidth,
                  maxWidth: pt.maxWidth,
                  canceled: pt.canceled,
                  lostCapture: pt.lostCapture,
                  pairedTouchSeq: pt.pairedTouchTrack ? pt.pairedTouchTrack.seq : null,
                  pointCount: pt.points.length,
                  points: downsampleTrackPoints(pt.points, 60)
                };
              }),
              touchTracks: s.tTracks.map(function (tt) {
                return {
                  seq: tt.seq,
                  id: tt.id,
                  touchType: tt.touchType,
                  startT: tt.startT,
                  endT: tt.endT,
                  pathLen: round2(tt.pathLen),
                  minRadiusX: tt.minRadiusX,
                  maxRadiusX: tt.maxRadiusX,
                  canceled: tt.canceled,
                  pairedPointerSeq: tt.pairedPointerTrack ? tt.pairedPointerTrack.seq : null,
                  pointCount: tt.points.length,
                  points: downsampleTrackPoints(tt.points, 60)
                };
              })
            };
          })
        };
        return JSON.stringify(payload, null, 2);
      }

      function copyExportJson() {
        var jsonStr = buildExportJsonString();
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(jsonStr).then(function () {
            showToast('✅ 스냅샷 JSON이 클립보드에 복사되었습니다!');
          }).catch(function () {
            showFallbackTextarea(jsonStr);
          });
        } else {
          showFallbackTextarea(jsonStr);
        }
      }

      function showFallbackTextarea(jsonStr) {
        if (!modalOverlay.classList.contains('show') && snapshots.length > 0) {
          openSnapshotModal(snapshots.length - 1);
        } else {
          modalOverlay.classList.add('show');
        }
        jsonFallbackBox.classList.add('show');
        jsonTextarea.value = jsonStr;
        jsonTextarea.focus();
        jsonTextarea.select();
        showToast('📋 아래 텍스트창의 JSON을 복사해 주세요.');
      }

      // 상단 바 버튼 이벤트 바인딩
      btnCaptureDrop.addEventListener('click', function () {
        captureSnapshotNow();
      });
      btnOpenSnapshots.addEventListener('click', function () {
        openSnapshotModal(activeSnapshotIdx >= 0 ? activeSnapshotIdx : snapshots.length - 1);
      });
      btnCopyJson.addEventListener('click', function () {
        copyExportJson();
      });
      btnModalCopyJson.addEventListener('click', function () {
        copyExportJson();
      });
      btnClearCanvas.addEventListener('click', function () {
        ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        showToast('🧹 캔버스 화면을 지웠습니다.');
      });
      btnTogglePreventDefault.addEventListener('click', function () {
        touchPreventDefaultOn = !touchPreventDefaultOn;
        btnTogglePreventDefault.textContent = 'touch preventDefault: ' + (touchPreventDefaultOn ? 'ON' : 'OFF');
        btnTogglePreventDefault.className = 'bar-btn ' + (touchPreventDefaultOn ? 'on' : 'off');
        showToast('touch preventDefault: ' + (touchPreventDefaultOn ? 'ON' : 'OFF'));
      });
      btnCloseModal.addEventListener('click', function () {
        modalOverlay.classList.remove('show');
      });
    })();
  </script>
</body>
</html>
